<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f3ee">
  <title>PRODUCT LAB · CRM</title>
  <link rel="icon" type="image/png" href="assets/favicon-crown.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261117">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="logo" href="./" aria-label="PRODUCT LAB CRM">
      <img class="logo-crown" src="assets/crown-logo.png" alt="" width="315" height="272">
      <span>PRODUCT <b>LAB</b></span>
      <span class="logo-tag">CRM</span>
    </a>
    <div class="header-right">
      <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang_label">
        <button type="button" class="lang-btn" data-lang="sr" aria-pressed="true">SR</button>
        <span aria-hidden="true">/</span>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="btn btn-gold" id="newLeadBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="new_lead">Novi lead</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <p class="eyebrow" data-i18n="eyebrow">CLIENT PIPELINE / PRODUCT LAB</p>
      <h1 data-i18n-html="h1">Svaki upit.<br><em>Do naplate.</em></h1>
      <p class="lead" data-i18n="intro"></p>
    </section>

    <section class="stats" aria-live="polite">
      <div class="stat"><span data-i18n="st_open"></span><strong id="statOpen">0</strong></div>
      <div class="stat"><span data-i18n="st_pipeline"></span><strong id="statPipeline">0 €</strong></div>
      <div class="stat stat-dark"><span data-i18n="st_won"></span><strong id="statWon">0 €</strong></div>
      <div class="stat"><span data-i18n="st_due"></span><strong id="statDue">0</strong><small data-i18n="st_due_hint"></small></div>
    </section>

    <section class="board">
      <div class="toolbar">
        <div class="chips" id="stageChips" role="tablist"></div>
        <div class="toolbar-row">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="search" autocomplete="off" data-i18n-attr="placeholder:search;aria-label:search">
          </label>
          <select id="sort" class="select" data-i18n-attr="aria-label:sort_label">
            <option value="follow" data-i18n="sort_follow"></option>
            <option value="new" data-i18n="sort_new"></option>
            <option value="value" data-i18n="sort_value"></option>
          </select>
        </div>
        <p class="count" id="resultCount"></p>
      </div>

      <div class="lead-grid" id="leadGrid"></div>

      <div class="empty hidden" id="emptyState">
        <img src="assets/crown-logo.png" alt="" width="315" height="272">
        <h3 data-i18n="empty_t"></h3>
        <p data-i18n="empty_p"></p>
        <button type="button" class="btn btn-dark" id="emptyAddBtn" data-i18n="new_lead"></button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footer_note"></p>
    <div class="footer-actions">
      <button type="button" class="text-btn" id="exportBtn" data-i18n="export"></button>
      <label class="text-btn">
        <span data-i18n="import"></span>
        <input type="file" id="importInput" accept="application/json,.json" hidden>
      </label>
    </div>
  </footer>

  <div class="modal" id="leadModal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <p class="eyebrow" id="modalEyebrow">PRODUCT LAB</p>
          <h2 id="modalTitle"></h2>
          <p class="muted" data-i18n="m_sub"></p>
        </div>
        <button type="button" class="icon-btn" id="closeModalBtn" data-i18n-attr="aria-label:close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <form id="leadForm" novalidate>
        <div class="form-grid">
          <label><span data-i18n="f_name"></span><input id="fName" maxlength="120" autocomplete="off"></label>
          <label><span data-i18n="f_brand"></span><input id="fBrand" maxlength="120" autocomplete="off"></label>
          <label><span data-i18n="f_ig"></span><input id="fIg" maxlength="80" placeholder="@shop" autocomplete="off" autocapitalize="none"></label>
          <label><span data-i18n="f_email"></span><input id="fEmail" type="email" maxlength="160" autocomplete="off"></label>
          <label><span data-i18n="f_phone"></span><input id="fPhone" type="tel" maxlength="40" autocomplete="off"></label>
          <label><span data-i18n="f_source"></span>
            <select id="fSource">
              <option value="instagram" data-i18n="src_ig"></option>
              <option value="website" data-i18n="src_site"></option>
              <option value="referral" data-i18n="src_ref"></option>
              <option value="other" data-i18n="src_other"></option>
            </select>
          </label>
          <label class="span-2"><span data-i18n="f_product"></span><input id="fProduct" maxlength="160" data-i18n-attr="placeholder:f_product_ph"></label>
          <label><span data-i18n="f_package"></span>
            <select id="fPackage">
              <option value="" data-i18n="pkg_none"></option>
              <option value="START">START · 49 €</option>
              <option value="GROW">GROW · 99 €</option>
              <option value="BRAND">BRAND · 199 €</option>
              <option value="CUSTOM">CUSTOM</option>
            </select>
          </label>
          <label><span data-i18n="f_value"></span><input id="fValue" type="number" min="0" step="1" inputmode="numeric"></label>
          <label><span data-i18n="f_stage"></span><select id="fStage"></select></label>
          <label><span data-i18n="f_followup"></span><input id="fFollow" type="date"></label>
          <label class="span-2"><span data-i18n="f_notes"></span><textarea id="fNotes" rows="4" maxlength="4000" data-i18n-attr="placeholder:f_notes_ph"></textarea></label>
        </div>

        <div class="modal-foot">
          <button type="button" class="text-btn danger hidden" id="deleteBtn" data-i18n="delete"></button>
          <div class="foot-right">
            <button type="button" class="btn btn-ghost" id="cancelBtn" data-i18n="cancel"></button>
            <button type="submit" class="btn btn-dark" data-i18n="save"></button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="i18n.js?v=20261117"></script>
  <script src="script.js?v=20261117"></script>
</body>
</html>
